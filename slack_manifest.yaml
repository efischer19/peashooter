# Slack app manifest: api.slack.com/apps → Create New App → From a manifest → paste this.
# Posting only needs chat:write. (Reading DMs for pick fixes will add Socket Mode and more scopes later.)
display_information:
  name: PEAshooter
  description: "Pick 'Em All, Shooter: an NBA pick 'em pool"
  background_color: "#1d428a"
features:
  bot_user:
    display_name: PEAshooter
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
